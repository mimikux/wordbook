<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f6ec"><title>Wordbook｜HTTPS 語音測試</title><link rel="stylesheet" href="./styles.css"><style>
body{background:#faf8ed;color:#384234;font-family:system-ui,sans-serif}.voice-check{max-width:560px;margin:clamp(25px,8vh,90px) auto;padding:24px}.voice-check h1{font-family:Georgia,serif;font-size:38px;font-weight:400}.voice-check .btn{display:block;margin:12px 0;width:100%;height:52px}.voice-check pre{white-space:pre-wrap;word-break:break-word;background:#ebece3;padding:15px;border-radius:14px;line-height:1.7;font-size:13px}.voice-check audio{width:100%}.voice-check a{color:#506b4a}
</style></head><body><main class="voice-check"><h1>Wordbook · 語音測試</h1>
<p>這個公開測試頁不包含你的單字資料，不需登入。專門檢查 HTTPS 網頁上的 Android Chrome 能否播放音檔及美式語音。</p>
<button class="btn btn-primary" id="play-html">1. 直接播放 MP3</button>
<audio id="native" src="./assets/voice-test.mp3" controls preload="none"></audio>
<button class="btn btn-primary" id="play-web">2. 用 Web Audio 播放相同 MP3</button>
<button class="btn btn-primary" id="play-tts">3. 系統美式語音讀 Hello</button>
<p>按測試鍵後留意媒體音量與 Chrome「開啟／關閉網站音訊」。</p>
<pre id="result" role="status">等待測試…</pre><a href="./">返回 Wordbook</a></main>
<script>
const out=document.getElementById('result');const log=(label,detail)=>{out.textContent+=`\n${new Date().toLocaleTimeString()}: ${label}: ${detail}`;};
const audio=document.getElementById('native');
const desc=()=>`protocol=${location.protocol}, muted=${audio.muted}, volume=${audio.volume}, paused=${audio.paused}, time=${audio.currentTime.toFixed(1)}, error=${audio.error?.code||'none'}`;
log('環境',`${location.protocol} ${navigator.userAgent}`);
['playing','ended','pause','error'].forEach(name=>audio.addEventListener(name,()=>log('MP3 '+name,desc())));
document.getElementById('play-html').onclick=async()=>{try{audio.currentTime=0;await audio.play();log('MP3 play resolved',desc());}catch(e){log('MP3 blocked',e.name+' '+e.message);}};
document.getElementById('play-web').onclick=async()=>{try{const ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const b=await(await fetch('./assets/voice-test.mp3')).arrayBuffer();const buf=await ctx.decodeAudioData(b);const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.onended=()=>{log('Web Audio ended','decoded='+buf.duration.toFixed(2)+'s');ctx.close();};src.start();log('Web Audio start',`${ctx.state}, decoded=${buf.duration.toFixed(2)}s`);}catch(e){log('Web Audio failed',e.name+' '+e.message);}};
document.getElementById('play-tts').onclick=()=>{try{const u=new SpeechSynthesisUtterance('Hello');u.lang='en-US';u.onstart=()=>log('TTS started','en-US');u.onend=()=>log('TTS ended','complete');u.onerror=e=>log('TTS error',e.error);speechSynthesis.cancel();speechSynthesis.speak(u);log('TTS requested','en-US');}catch(e){log('TTS failed',e.message);}};
</script></body></html>
