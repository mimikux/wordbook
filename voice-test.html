<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordbook 語音測試</title><style>body{font:16px/1.65 system-ui;background:#faf8ed;color:#394735;max-width:530px;margin:30px auto;padding:20px}h1{font:normal 40px Georgia,serif}button{display:block;width:100%;border:0;border-radius:14px;padding:17px;margin:15px 0;background:#637a5c;color:#fff;font-size:16px}audio{width:100%}pre{background:#e8ebe3;border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Wordbook · 語音測試</h1><p>這是 HTTPS 公開測試頁，不含私人詞庫。請用 Android Chrome 依序試播以下三種方法。</p><button id="html">① 原生 HTML 音訊測試</button><audio id="player" controls></audio><button id="web">② Web Audio 音訊測試</button><button id="tts">③ 美式英語語音 Hello, Wordbook</button><button id="stop">停止播放</button><pre id="log">等待測試…</pre><script>
const o=document.getElementById('log');const log=x=>o.textContent+='\n'+new Date().toLocaleTimeString()+' '+x;const a=document.getElementById('player');let ctx,src;
const hz=24000,n=hz,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);function w(i,s){for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j))}w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,hz,true);v.setUint32(28,hz*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){let t=i/hz;v.setInt16(44+i*2,Math.round(11000*Math.sin(2*Math.PI*650*t)*Math.min(1,t/.03,(1-t)/.08)),true)}const b=new Blob([buf],{type:'audio/wav'});a.src=URL.createObjectURL(b);
log('protocol='+location.protocol+' origin='+location.origin);
for(let event of ['playing','ended','error'])a.addEventListener(event,()=>log('HTML '+event+' muted='+a.muted+' volume='+a.volume));
document.getElementById('html').onclick=async()=>{try{a.currentTime=0;await a.play();log('HTML play ok')}catch(e){log('HTML error '+e.name+': '+e.message)}};
document.getElementById('web').onclick=async()=>{try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let d=await ctx.decodeAudioData(await b.arrayBuffer());src=ctx.createBufferSource();src.buffer=d;src.connect(ctx.destination);src.start();log('Web Audio '+ctx.state+' duration '+d.duration);src.onended=()=>log('Web Audio ended')}catch(e){log('Web Audio error '+e.message)}};
document.getElementById('tts').onclick=()=>{try{const u=new SpeechSynthesisUtterance('Hello, Wordbook');u.lang='en-US';u.onstart=()=>log('TTS started');u.onend=()=>log('TTS ended');u.onerror=e=>log('TTS error '+e.error);speechSynthesis.cancel();speechSynthesis.speak(u);log('TTS requested')}catch(e){log('TTS error '+e.message)}};
document.getElementById('stop').onclick=()=>{a.pause();try{src?.stop()}catch(e){}try{ctx?.close()}catch(e){}speechSynthesis?.cancel();log('stopped')};
</script></body></html>
